name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q ojek-olumajang.zip -d extracted

          PROJECT_DIR=$(find extracted -name package.json -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json tidak ditemukan"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          rm -rf extracted
          rm -f ojek-olumajang.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "Extract Ojek Olumajang project"
            git push
          fi
