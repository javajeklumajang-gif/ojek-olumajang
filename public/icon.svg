<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#052e16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle (Safe for Maskable 80% circle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Inner Safe Circle Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>

  <!-- Center Emblem: Stylized Modern Motorbike Helmet & Motion Wing -->
  <g transform="translate(256, 230)" filter="url(#shadow)">
    <!-- Speed Wings / Road Rays -->
    <path d="M-130,50 C-110,20 -60,-10 0,-10 C60,-10 110,20 130,50 C90,30 50,20 0,20 C-50,20 -90,30 -130,50 Z" fill="#ffffff" fill-opacity="0.25"/>
    
    <!-- Outer Helmet Shell -->
    <path d="M-90,30 C-90,-60 -50,-110 0,-110 C50,-110 90,-60 90,30 C90,50 75,65 55,65 L-55,65 C-75,65 -90,50 -90,30 Z" fill="#ffffff"/>
    
    <!-- Visor -->
    <path d="M-70,10 C-70,-35 -35,-65 0,-65 C35,-65 70,-35 70,10 C70,26 58,34 38,34 L-38,34 C-58,34 -70,26 -70,10 Z" fill="#0f172a"/>
    
    <!-- Visor Reflection -->
    <path d="M-50,-10 C-30,-45 0,-52 20,-52 C10,-45 -20,-35 -35,5 Z" fill="#38bdf8" fill-opacity="0.8"/>
    
    <!-- Pin Location / Wheel Dot at Base -->
    <circle cx="0" cy="100" r="16" fill="#facc15"/>
    <path d="M-30,96 L-10,116 L10,116 L30,96" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wordmark Tag -->
  <text x="256" y="415" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4">OLUMAJANG</text>
  <text x="256" y="445" text-anchor="middle" fill="#bbf7d0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" letter-spacing="2">OJEK KEBANGGAAN LUMAJANG</text>
</svg>
